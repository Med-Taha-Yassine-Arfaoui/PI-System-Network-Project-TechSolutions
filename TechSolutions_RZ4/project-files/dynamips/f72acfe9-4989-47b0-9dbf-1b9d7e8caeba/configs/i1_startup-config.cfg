!
!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname RZ-4
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
no ip dhcp use vrf connected
ip dhcp excluded-address 192.168.42.1 192.168.42.50
!
ip dhcp pool COLLAB_POOL
   network 192.168.42.0 255.255.255.0
   default-router 192.168.42.1 
   dns-server 8.8.8.8 
!
!
no ip domain lookup
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
crypto isakmp policy 10
 encr aes 256
 authentication pre-share
 group 5
crypto isakmp key SecureCollabVPN2024! address 192.168.40.1
crypto isakmp key SecureVPN2024! address 192.168.42.1
!
!
crypto ipsec transform-set VPN-TRANSFORM esp-aes 256 esp-sha-hmac 
!
crypto map VPN-MAP 10 ipsec-isakmp 
 set peer 192.168.40.1
 set transform-set VPN-TRANSFORM 
 match address 100
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface Tunnel300
 ip address 10.30.30.2 255.255.255.252
 tunnel source 192.168.42.1
 tunnel destination 172.16.0.1
!
interface FastEthernet0/0
 description Connection to Cloud2 (UDP_COLLAB)
 ip address 200.100.4.2 255.255.255.0
 ip nat outside
 ip virtual-reassembly
 duplex auto
 speed auto
!
interface FastEthernet0/1
 description Collaboration Department LAN
 ip address 192.168.42.1 255.255.255.0
 ip access-group NFS-SERVER-PROTECTION in
 ip nat inside
 ip virtual-reassembly
 duplex auto
 speed auto
 crypto map VPN-MAP
!
router ospf 1
 router-id 10.4.4.5
 log-adjacency-changes
 network 10.0.0.0 0.0.0.255 area 0
 network 192.168.42.0 0.0.0.255 area 0
 network 192.168.43.12 0.0.0.3 area 0
 network 192.168.43.0 0.0.0.63 area 0
 network 192.168.44.0 0.0.0.255 area 0
 network 200.100.4.0 0.0.0.255 area 0
!
ip forward-protocol nd
ip route 10.0.0.0 255.255.255.0 200.100.1.2
ip route 192.168.42.0 255.255.255.0 FastEthernet0/1
ip route 192.168.50.10 255.255.255.255 10.30.30.1
ip route 192.168.60.10 255.255.255.255 10.30.30.1
ip route 200.100.0.0 255.255.0.0 200.100.4.254
ip route 200.100.2.0 255.255.255.0 200.100.4.1
ip route 200.100.3.0 255.255.255.0 200.100.4.1
!
!
no ip http server
no ip http secure-server
ip nat inside source list 1 interface FastEthernet0/0 overload
!
ip access-list extended NFS-SERVER-PROTECTION
 remark === Allow NFS traffic from authorized networks ===
 permit tcp 192.168.40.0 0.0.0.255 host 192.168.42.10 eq 2049
 permit udp 192.168.40.0 0.0.0.255 host 192.168.42.10 eq 2049
 permit tcp 192.168.32.0 0.0.0.255 host 192.168.42.10 eq 2049
 permit udp 192.168.32.0 0.0.0.255 host 192.168.42.10 eq 2049
 permit tcp 192.168.0.0 0.0.0.255 host 192.168.42.10 eq 2049
 permit udp 192.168.0.0 0.0.0.255 host 192.168.42.10 eq 2049
 remark === Allow RPC/Portmapper ===
 permit tcp any host 192.168.42.10 eq sunrpc
 permit udp any host 192.168.42.10 eq sunrpc
 permit tcp any host 192.168.42.10 eq 20048
 permit tcp any host 192.168.42.10 eq 20049
 permit udp any host 192.168.42.10 eq 20049
 remark === Allow return traffic and outbound from NFS server ===
 permit tcp host 192.168.42.10 any
 permit udp host 192.168.42.10 any
 remark === Allow all traffic FROM collaboration network ===
 permit ip 192.168.42.0 0.0.0.255 any
 remark === Allow ICMP ===
 permit icmp any any
 remark === Allow OSPF ===
 permit ospf any any
 remark === Allow SSH ===
 permit tcp any any eq 22
 remark === Allow established connections ===
 permit tcp any any established
 remark === Allow DNS and NTP ===
 permit udp any any eq domain
 permit tcp any any eq domain
 permit udp any any eq ntp
 remark === Deny and log everything else ===
 deny   ip any any log
ip access-list extended ZONE-SEPARATION
 remark === Allow only necessary services between zones ===
 remark Allow NFS to authorized networks
 permit tcp 192.168.40.0 0.0.0.255 192.168.42.0 0.0.0.255 eq 2049
 permit tcp 192.168.32.0 0.0.0.255 192.168.42.0 0.0.0.255 eq 2049
 permit tcp 192.168.0.0 0.0.0.255 192.168.42.0 0.0.0.255 eq 2049
 remark Allow DNS
 permit udp any any eq domain
 remark Allow Web services
 permit tcp any any eq www
 permit tcp any any eq 443
 remark Allow monitoring (SNMP)
 permit udp any any eq snmp
 permit udp any any eq snmptrap
 remark Allow ICMP
 permit icmp any any
 remark Allow OSPF
 permit ospf any any
 remark Block everything else between different zones
 deny   ip 192.168.40.0 0.0.0.255 192.168.32.0 0.0.0.255 log
 deny   ip 192.168.32.0 0.0.0.255 192.168.0.0 0.0.0.255 log
 permit ip any any
!
access-list 1 permit 192.168.44.0 0.0.0.255
access-list 1 permit 192.168.42.0 0.0.0.255
access-list 100 permit ip 192.168.42.0 0.0.0.255 192.168.40.0 0.0.0.255
access-list 100 permit ip 192.168.40.0 0.0.0.255 192.168.42.0 0.0.0.255
access-list 101 permit tcp 192.168.42.0 0.0.0.255 host 192.168.42.10 eq 3306
access-list 101 permit udp 192.168.42.0 0.0.0.255 host 192.168.42.10 eq 2049
access-list 101 permit tcp 192.168.42.0 0.0.0.255 host 192.168.42.10 eq 22
access-list 102 permit tcp 192.168.40.0 0.0.0.255 host 192.168.42.10 eq 2049
access-list 102 permit udp 192.168.40.0 0.0.0.255 host 192.168.42.10 eq 2049
access-list 102 permit tcp 192.168.40.0 0.0.0.255 host 192.168.42.10 eq sunrpc
access-list 102 permit udp 192.168.40.0 0.0.0.255 host 192.168.42.10 eq sunrpc
access-list 102 permit tcp 192.168.40.0 0.0.0.255 host 192.168.42.10 eq 20048
access-list 102 permit tcp 192.168.40.0 0.0.0.255 host 192.168.42.10 eq 20049
access-list 102 permit udp 192.168.40.0 0.0.0.255 host 192.168.42.10 eq 20049
no cdp log mismatch duplex
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
